{% extends "layouts/layout.html" %}

{% block title %}Сайты{% endblock %}

{% block content %}

<div class="mx-auto max-w-7xl px-4 py-4">
    <h1 class="mb-3 text-4xl font-normal text-gray-800">
        Сайты
    </h1>

    <table
        class="w-full border-collapse border border-gray-300 text-left"
        data-test="urls"
    >
        <thead>
            <tr>
                <th class="border border-gray-300 px-2 py-2 font-normal">
                    ID
                </th>
                <th class="border border-gray-300 px-2 py-2 font-normal">
                    Имя
                </th>
                <th class="border border-gray-300 px-2 py-2 font-normal">
                    Последняя проверка
                </th>
                <th class="border border-gray-300 px-2 py-2 font-normal">
                    Код ответа
                </th>
            </tr>
        </thead>

        <tbody>
            {% for url in urls %}
                <tr>
                    <td class="border border-gray-300 px-2 py-2">
                        {{ url.id }}
                    </td>

                    <td class="border border-gray-300 px-2 py-2">
                        <a
                            href="{{ url_for('urls_show', id=url.id) }}"
                            class="text-blue-600 underline"
                        >
                            {{ url.name }}
                        </a>
                    </td>

                    <td class="border border-gray-300 px-2 py-2">
                    </td>

                    <td class="border border-gray-300 px-2 py-2">
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
